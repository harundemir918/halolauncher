name: halo_android
description: "Halo Launcher's Android platform layer: the Kotlin side and the AndroidBackend for halo_sdk."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.3
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  halo_sdk:
    path: ../halo_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.harundemir.halolauncher.platform
        pluginClass: HaloAndroidPlugin
